<svg data-theme="light" xmlns="http://www.w3.org/2000/svg" class="arch" viewBox="28 32 842 99" role="img" aria-label="Multi-cloud">
<style>:root { --bg: #FDFDFC; --surface: #FFFFFF; --sunken: #F5F7FA; --fg: #0F1729; --fg-2: #475467; --fg-3: #6B7588; --line: #E4E9F0; --primary: #004FF8; --primary-soft: #EFF4FC; --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0C111B; --surface: #121927; --sunken: #182132; --fg: #E8EDF5; --fg-2: #B3BDCC; --fg-3: #8C97A8; --line: #253046; --primary: #5B8CFF; --primary-soft: #16244A; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0C111B; --surface: #121927; --sunken: #182132; --fg: #E8EDF5; --fg-2: #B3BDCC; --fg-3: #8C97A8; --line: #253046; --primary: #5B8CFF; --primary-soft: #16244A; color-scheme: dark; }
.arch { margin: 18px 0 22px; }
.arch-scroll { overflow-x: auto; border: 1px solid var(--line, #E4E9F0); border-radius: 12px; background: var(--surface, #FFFFFF); padding: 12px; }
.arch svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--fg-3, #6B7588); font-family: var(--font-body, "Inter", system-ui, -apple-system, "Segoe UI", sans-serif); }
.arch .band { fill: var(--sunken, #F5F7FA); }
.arch .band.b2 { fill: none; stroke: var(--line, #E4E9F0); stroke-dasharray: 5 5; }
.arch .band-t { fill: var(--fg-3, #6B7588); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
.arch .t { fill: var(--fg, #0F1729); font-size: 14px; font-weight: 600; }
.arch .t.mono { font-family: var(--font-mono, "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace); font-size: 12.5px; font-weight: 500; }
.arch .gk-t { fill: var(--primary, #004FF8); font-size: 16px; font-weight: 700; }
.arch .s { fill: var(--fg-3, #6B7588); font-size: 11.5px; }
.arch .a { fill: none; stroke: var(--fg-3, #6B7588); stroke-width: 1.4; }
.arch .a.acc { stroke: var(--primary, #004FF8); stroke-width: 2; }
.arch .mk { fill: var(--fg-3, #6B7588); }
.arch .mk-a { fill: var(--primary, #004FF8); }
.arch .l { fill: var(--fg-2, #475467); font-size: 11.5px; }
.arch .acc-t { fill: var(--primary, #004FF8); font-weight: 600; }
.arch .ink { color: var(--fg, #0F1729); }
.arch .tile { fill: var(--surface, #FFFFFF); stroke: var(--line, #E4E9F0); stroke-width: 1.2; }
.arch .gk-ring { fill: var(--primary-soft, #EFF4FC); stroke: var(--primary, #004FF8); stroke-width: 2; }
.arch figcaption { font-size: 13px; color: var(--fg-2, #475467); margin-top: 10px; max-width: 80ch; }
svg.arch { color: var(--fg-3); background: var(--surface); font-family: var(--font-body); }</style>
