[project]
name = "archdiagram"
version = "0.1.0"
description = "YAML spec -> hand-quality architecture diagrams as themeable inline SVG, with official provider icons."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lisandro Pintos" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
archdiagram = "archdiagram.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archdiagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/pingedbrain/archdiagram"
