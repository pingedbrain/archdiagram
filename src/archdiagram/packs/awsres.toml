# AWS Resource Icons (official): the per-resource glyphs (48px, coloured on transparent) that go
# with each service icon — EC2 instance, NAT gateway, subnets, tables... Drawn on a tile like
# generic glyphs so they read as "the thing inside the service" next to the service squares.
name = "awsres"
title = "AWS Resource Icons"
version = "07312026"
homepage = "https://aws.amazon.com/architecture/icons/"
license = "AWS permits use of the icons in architecture diagrams; do not redistribute the package or alter the icons."
source = { kind = "archive", url = "https://d1.awsstatic.com/onedam/marketing-channels/website/public/shared/architecture-icon-release/Icon-package_07312026.5846e92413caa21490223536cc97f1269e44fa92.zip" }
include = ["Resource-Icons_07312026/*/Res_*_48.svg"]
color = "keep"
tile = true
inset = 0.8

