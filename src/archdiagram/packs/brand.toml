# Simple Icons (CC0 1.0): single-colour 24x24 brand glyphs, coloured with each brand's official hex.
# Every SVG file stem (slug) is a valid name: brand:<slug>. Logos stay trademarks of their owners.
name = "brand"
title = "Simple Icons"
version = "16.34.0"
homepage = "https://simpleicons.org/"
license = "Icons CC0 1.0; the marks are trademarks of their owners. Follow each brand's guidelines (simple-icons data 'guidelines' field); do not imply endorsement."
source = { kind = "archive", url = "https://registry.npmjs.org/simple-icons/-/simple-icons-16.34.0.tgz" }
include = ["package/icons/*.svg"]
color = "brand"
brand_data = "package/data/simple-icons.json"
tile = true
inset = 0.5

[aliases]
jira = "package/icons/jira.svg"
