title: Retail API — multi-AZ
claim: la lectura escala en dos AZs detrás del ALB; los writes pasan por SQS y worker
caption: CDN + WAF en el borde, NAT para egress, SQS desacopla writes. awsres + aws.
icons: { packs: [aws, awsres, generic] }
zones:
  - { cells: [4, -1.1, 10.9, 3.6], label: "VPC 10.0.0.0/16", style: dashed, badge: aws:group-vpc, tint: orange }
  - { cells: [4, -0.7, 6.6, 0.2], label: "public", style: dotted, badge: aws:public-subnet, tint: green }
  - { cells: [4, 1.7, 6.0, 2.6], label: "private a", style: dotted, badge: aws:private-subnet, tint: blue }
  - { cells: [7, 1.7, 9.4, 2.6], label: "private b", style: dotted, badge: aws:private-subnet, tint: blue, label_side: bottom }
legend:
  - { sample: dots, text: "request" }
  - { sample: ants, text: "egress" }
  - { sample: dashed, text: "async" }
  - { sample: zone-dotted, tint: blue, text: "subnet" }
nodes:
  r53:    { icon: aws:Arch_Amazon-Route-53_48, at: [0, -0.5], label: Route53, mono: true }
  cdn:    { icon: aws:Arch_Amazon-CloudFront_48, at: [1.4, -0.5], label: CDN }
  waf:    { icon: aws:Arch_AWS-WAF_48, at: [3.3, -0.5], label: WAF }
  alb:    { icon: awsres:alb, at: [4.6, -0.5], label: ALB }
  nat:    { icon: awsres:nat, at: [6, 0.4], label: NAT, label_side: left }
  app_a:  { icon: awsres:ec2, at: [4.6, 1.4], label: app, sub: "az-a", note: "t3.large" }
  cache_a: { icon: aws:Arch_Amazon-ElastiCache_48, at: [5.9, 1.9], label: cache }
  app_b:  { icon: awsres:ec2, at: [7.4, 1.4], label: app, sub: "az-b", note: "t3.large" }
  cache_b: { icon: aws:Arch_Amazon-ElastiCache_48, at: [8.6, 1.8], label: cache, label_side: right }
  worker: { icon: aws:lambda, at: [7.4, 2.4], label: worker, mono: true }
  sqs:    { icon: aws:sqs, at: [10.2, 2.4], label: SQS }
  ddb:    { icon: awsres:table, at: [4.6, 3.8], label: orders, mono: true }
  rds:    { icon: aws:aurora, at: [6.2, 3.8], label: catalog }
  s3:     { icon: aws:s3, at: [10.7, -1.9], label: assets, label_side: right }
edges:
  - { from: r53, to: cdn, label: alias, num: true }
  - { from: cdn, to: waf, label: filter, num: true }
  - { from: waf, to: alb, label: https, flow: dots, num: true }
  - { from: alb, to: app_a, label: forward, flow: dots, num: true }
  - { from: alb, to: app_b, label: forward, via: [[1095, 15], [1095, 224]] }
  - { from: app_a, to: cache_a, label: get }
  - { from: app_b, to: cache_b, label: get }
  - { from: app_a, to: nat, label: egress, route: hv, flow: ants, label_side: below }
  - { from: app_a, to: ddb, label: read, dashed: true, label_side: left }
  - { from: app_a, to: rds, label: sql, via: [[800, 300], [800, 488]] }
  - { from: worker, to: ddb, label: write, route: hv, label_side: below }
  - { from: sqs, to: worker, label: poll, dashed: true }
  - { from: app_b, to: sqs, label: enqueue }
  - { from: app_b, to: s3, label: put, arrow: open }
